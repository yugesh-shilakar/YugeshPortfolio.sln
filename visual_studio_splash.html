<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Microsoft Visual Studio</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1b0e3d;
  }

  .splash {
    position: relative;
    width: 1011px;
    height: 620px;
    margin: 0 auto;
    overflow: hidden;
    background: #2c1a5e;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  /* base gradient layer - deep purple/violet background */
  .layer-base {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #6a3fd6 0%, #7b4fe0 25%, #3a1f7a 55%, #2a1660 100%);
  }

  /* top-left large violet diagonal wedge */
  .wedge-topleft {
    position: absolute;
    top: -10%;
    left: -10%;
    width: 90%;
    height: 60%;
    background: linear-gradient(160deg, #8a5cf0 0%, #6f3fe0 60%, #5a2fc9 100%);
    clip-path: polygon(0% 0%, 100% 0%, 55% 55%, 0% 100%);
  }

  /* top-right lighter pink/violet wedge */
  .wedge-topright {
    position: absolute;
    top: -10%;
    right: -10%;
    width: 60%;
    height: 70%;
    background: linear-gradient(200deg, #e2a6ff 0%, #c98cf5 40%, #a86bec 100%);
    clip-path: polygon(30% 0%, 100% 0%, 100% 100%, 0% 45%);
  }

  /* central dark purple curved band */
  .band-center {
    position: absolute;
    top: 0;
    left: -5%;
    width: 110%;
    height: 100%;
    background: radial-gradient(ellipse 80% 60% at 45% 45%, #2a0f5e 0%, #170733 55%, #0e0322 100%);
    clip-path: polygon(0% 30%, 100% 12%, 100% 78%, 0% 62%);
  }

  /* bottom-left bright violet swoop */
  .wedge-bottomleft {
    position: absolute;
    bottom: -15%;
    left: -15%;
    width: 75%;
    height: 65%;
    background: linear-gradient(20deg, #a55cf0 0%, #7f3fe6 45%, #5a2fc9 100%);
    clip-path: polygon(0% 40%, 60% 0%, 100% 100%, 0% 100%);
  }

  /* bottom-right dark violet swoop */
  .wedge-bottomright {
    position: absolute;
    bottom: -20%;
    right: -15%;
    width: 65%;
    height: 70%;
    background: linear-gradient(320deg, #7a3fe0 0%, #4a1f9e 40%, #1c0b47 100%);
    clip-path: polygon(20% 0%, 100% 15%, 100% 100%, 0% 100%);
  }

  .close-btn {
    position: absolute;
    top: 14px;
    right: 16px;
    width: 20px;
    height: 20px;
    color: rgba(255,255,255,0.85);
    font-size: 18px;
    line-height: 20px;
    text-align: center;
    font-family: Arial, sans-serif;
    z-index: 10;
    cursor: default;
    user-select: none;
  }

  .logo-block {
    position: absolute;
    top: 285px;
    left: 210px;
    display: flex;
    align-items: center;
    z-index: 5;
  }

  .ms-logo {
    display: grid;
    grid-template-columns: 26px 26px;
    grid-template-rows: 26px 26px;
    gap: 4px;
    margin-right: 22px;
  }

  .ms-logo span {
    background: #ffffff;
    width: 26px;
    height: 26px;
  }

  .title-text {
    color: #ffffff;
    font-size: 40px;
    font-weight: 500;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  .year-text {
    position: absolute;
    bottom: 18px;
    right: 26px;
    color: #ffffff;
    font-size: 26px;
    font-weight: 400;
    opacity: 0.95;
    z-index: 5;
  }
</style>
</head>
<body>

<div class="splash">
  <div class="layer-base"></div>
  <div class="wedge-topleft"></div>
  <div class="wedge-topright"></div>
  <div class="band-center"></div>
  <div class="wedge-bottomleft"></div>
  <div class="wedge-bottomright"></div>

  <div class="close-btn">&#10005;</div>

  <div class="logo-block">
    <div class="ms-logo">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="title-text">Microsoft Visual Studio</div>
  </div>

  <div class="year-text">2026</div>
</div>

</body>
</html>
